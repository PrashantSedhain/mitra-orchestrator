name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev,database]'
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src tests
      - run: pytest --cov=mitra_orchestrator --cov-report=term-missing
      - if: matrix.python-version == '3.11'
        run: ./scripts/validate-compose.sh
