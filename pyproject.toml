[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mitra-orchestrator"
version = "0.1.0"
description = "Self-hosted control plane for durable AI software-engineering jobs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "Mitra Orchestrator contributors"}]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]
database = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
]

[project.scripts]
mitra-api = "mitra_orchestrator.api.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mitra_orchestrator"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["mitra_orchestrator"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["mitra_orchestrator"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = true
